<script>'use strict';

const $ = id => document.getElementById(id);
async function decodeCompressedJson(encoded) {
  const binary = atob(encoded);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
  return JSON.parse(await new Response(stream).text());
}
function showLoadError(error) {
  console.error(error);
  $('loading').textContent = '地图加载失败，请刷新页面重试。';
}
async function start() {
const metadata = JSON.parse($('meta-data').textContent);
const cityRows = JSON.parse($('cities-data').textContent);
window.__HIGHWAY_DATA__ = window.__HIGHWAY_DATA__ || {};
const bundlePromises = new Map();
function loadBundle(name) {
  if (bundlePromises.has(name)) return bundlePromises.get(name);
  const promise = new Promise((resolve, reject) => {
    const script = document.createElement('script');
    script.src = 'highways_' + name + '.js?v=' + encodeURIComponent(metadata.data_version);
    script.onload = resolve;
    script.onerror = () => reject(new Error('无法加载分区数据：' + name));
    document.head.append(script);
  });
  bundlePromises.set(name, promise);
  return promise;
}
const project = (lon, lat) => [lon / 360, (1 - Math.log(Math.tan(Math.PI / 4 + lat * Math.PI / 360)) / Math.PI) / 2];
const unproject = p => [(2 * Math.atan(Math.exp((1 - 2 * p[1]) * Math.PI)) - Math.PI / 2) * 180 / Math.PI, p[0] * 360];
const inRegion = (members, region) => region === 'all' || members.includes(region) ||
  (region === 'husuzhe' && members.some(key => ['shanghai', 'jiangsu', 'zhejiang'].includes(key)));
const cities = cityRows.map(([name, lon, lat, region, id]) => ({name, lon, lat, region, id}));
const extent = items => {
  const b = [Infinity, Infinity, -Infinity, -Infinity];
  for (const i of items) {
    const q = roads[i].b;
    b[0] = Math.min(b[0], q[0]); b[1] = Math.min(b[1], q[1]);
    b[2] = Math.max(b[2], q[2]); b[3] = Math.max(b[3], q[3]);
  }
  return b;
};
let roads = [], regionBounds = null;
let region = 'jingjinji', active = [], activeCities = [], loadSequence = 0;
let W = 0, H = 0, cx = 0, cy = 0, s = 1, selected = -1, frame = 0, visible = [];
let matches = new Set();
const map = L.map('map', {minZoom: 3, maxZoom: 19, zoomAnimation: false, fadeAnimation: false, preferCanvas: true});
const basemap = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19, updateWhenIdle: true, keepBuffer: 1,
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap contributors</a>'
}).addTo(map);
const overview = L.imageOverlay(metadata.overview_image, metadata.overview_bounds, {opacity: 0.92, interactive: false});
const canvas = $('roads-canvas'), ctx = canvas.getContext('2d');
map.getPane('overlayPane').appendChild(canvas);
L.control.scale({position: 'bottomleft', metric: true, imperial: false, maxWidth: 90}).addTo(map);
const CaptionControl = L.Control.extend({
  options: {position: 'bottomleft'},
  onAdd() {L.DomEvent.disableClickPropagation($('caption')); return $('caption');}
});
new CaptionControl().addTo(map);
const popup = L.popup({closeButton: false, maxWidth: 320, maxHeight: 260, autoPanPadding: [25, 70]});
const screen = p => [(p[0] - cx) * s + W / 2, (p[1] - cy) * s + H / 2];
const regionName = key => key === 'all' ? '全部已接入区域' : key === 'husuzhe' ? '沪苏浙' : metadata.regions[key].name;

function drawSoon() {if (!frame) frame = requestAnimationFrame(draw);}
function message(text = '') {$('message').textContent = text; $('message').hidden = !text;}
function fit(b) {
  if (!b.every(Number.isFinite)) return;
  const bounds = [unproject([b[0], b[3]]), unproject([b[2], b[1]])];
  const captionHeight = $('caption').getBoundingClientRect().height;
  map.fitBounds(bounds, {paddingTopLeft: [35, 30], paddingBottomRight: [35, captionHeight + 45], maxZoom: 16, animate: false});
}
function closeInfo() {selected = -1; map.closePopup(popup); $('info').hidden = true; drawSoon();}
function reset() {
  matches.clear(); closeInfo(); $('query').value = ''; $('city').value = 'all';
  message(region === 'all' ? '全国总览；请选择具体省区查看和查询道路详情。' : ''); fit(regionBounds);
}
async function chooseRegion(key) {
  const sequence = ++loadSequence;
  const overviewOnly = key === 'all';
  const keys = key === 'husuzhe' ? ['shanghai', 'jiangsu', 'zhejiang'] : [key];
  if (overviewOnly) {
    roads = []; active = []; regionBounds = metadata.overview_projected_bounds;
    if (!map.hasLayer(overview)) overview.addTo(map);
  } else {
    if (map.hasLayer(overview)) map.removeLayer(overview);
  if (!keys.every(k => metadata.regions[k] && metadata.region_bundles[k])) return;
  $('loading').textContent = '正在加载' + regionName(key) + '高速路网…';
  $('loading').hidden = false;
  const bundles = [...new Set(keys.map(k => metadata.region_bundles[k]))];
  await Promise.all(bundles.map(loadBundle));
  const groups = await Promise.all(keys.map(k => decodeCompressedJson(window.__HIGHWAY_DATA__[k])));
  if (sequence !== loadSequence) return;
  const unique = new Map();
  for (const group of groups) for (const row of group) unique.set(row[0], row);
  roads = [...unique.values()].map(([id, name, ref, geometry, members]) => {
    const b = [Infinity, Infinity, -Infinity, -Infinity];
    const pts = geometry.map(([lon, lat]) => {
      const p = project(lon, lat);
      b[0] = Math.min(b[0], p[0]); b[1] = Math.min(b[1], p[1]);
      b[2] = Math.max(b[2], p[0]); b[3] = Math.max(b[3], p[1]);
      return p;
    });
    return {id, name, ref, pts, members, b};
  });
  active = roads.map((_, i) => i);
  regionBounds = extent(active);
  }
  region = key; $('region').value = key;
  const priority = ['成都', '重庆', '贵阳', '昆明', '兰州', '西宁', '银川', '乌鲁木齐', '拉萨', '呼和浩特', '海口', '香港', '澳门', '哈尔滨', '长春', '沈阳', '太原', '西安', '武汉', '长沙', '南宁', '桂林', '郑州', '合肥', '南昌', '福州', '厦门', '济南', '青岛', '深圳', '广州', '上海', '杭州', '南京', '北京', '天津'];
  const rank = c => priority.includes(c.name) ? priority.indexOf(c.name) : 20;
  activeCities = (overviewOnly ? [] : cities.filter(c => inRegion([c.region], key)))
    .filter((c, i, a) => a.findIndex(other => other.id === c.id) === i)
    .sort((a, b) => rank(a) - rank(b) || a.name.localeCompare(b.name, 'zh-CN'));
  $('count').textContent = (overviewOnly ? metadata.unique_count : active.length).toLocaleString('zh-CN');
  $('caption-title').textContent = regionName(key) + ' · OSM 高速路网';
  const regions = Object.keys(metadata.regions).filter(k => inRegion([k], key));
  const dates = [...new Set(regions.map(k => metadata.regions[k].date))].sort();
  $('date').textContent = '数据日期：' + dates.join(' / ');
  const select = $('city'); select.replaceChildren();
  const first = document.createElement('option'); first.value = 'all'; first.textContent = overviewOnly ? '选择省区后定位城市' : '定位城市'; select.append(first);
  activeCities.forEach((c, i) => {
    const option = document.createElement('option'); option.value = String(i); option.textContent = '定位' + c.name; select.append(option);
  });
  $('query').disabled = overviewOnly; select.disabled = overviewOnly;
  document.querySelector('#search button').disabled = overviewOnly;
  $('query').placeholder = overviewOnly ? '选择省区后搜索道路' : key === 'guangdong' ? '搜索道路，如 G4 / 沈海高速' :
    key === 'jingjinji' ? '搜索道路，如 G2 / 京哈高速' : '搜索道路，如 G2 / 沪昆高速';
  $('tools').open = false;
  reset();
  $('loading').hidden = true;
}
function path(road) {
  const first = road.pts[0]; let x = (first[0] - cx) * s + W / 2, y = (first[1] - cy) * s + H / 2;
  ctx.moveTo(x, y);
  for (let j = 1; j < road.pts.length; j++) {
    const p = road.pts[j], nx = (p[0] - cx) * s + W / 2, ny = (p[1] - cy) * s + H / 2;
    if (j === road.pts.length - 1 || Math.abs(nx - x) + Math.abs(ny - y) > 0.75) {
      ctx.lineTo(nx, ny); x = nx; y = ny;
    }
  }
}
function draw() {
  frame = 0;
  if (!map.getZoom()) return;
  const size = map.getSize(), ratio = Math.min(devicePixelRatio || 1, 2);
  W = size.x; H = size.y;
  if (canvas.width !== Math.round(W * ratio) || canvas.height !== Math.round(H * ratio)) {
    canvas.width = Math.round(W * ratio); canvas.height = Math.round(H * ratio);
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
  }
  L.DomUtil.setPosition(canvas, map.containerPointToLayerPoint([0, 0]));
  const center = map.getCenter(); [cx, cy] = project(center.lng, center.lat);
  s = map.options.crs.scale(map.getZoom());
  ctx.clearRect(0, 0, W, H);
  const l = cx - W / 2 / s, r = cx + W / 2 / s, t = cy - H / 2 / s, b = cy + H / 2 / s;
  visible = active.filter(i => {const q = roads[i].b; return q[0] <= r && q[2] >= l && q[1] <= b && q[3] >= t;});
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.strokeStyle = '#3388ff'; ctx.lineWidth = 3; ctx.globalAlpha = 0.9;
  for (const i of visible) path(roads[i]);
  ctx.stroke(); ctx.globalAlpha = 1;
  if (matches.size) {
    ctx.beginPath(); ctx.lineWidth = 4.5; ctx.strokeStyle = '#ed8b18';
    for (const i of visible) if (matches.has(i)) path(roads[i]);
    ctx.stroke();
  }
  if (selected >= 0) {ctx.beginPath(); ctx.lineWidth = 5.5; ctx.strokeStyle = '#d84254'; path(roads[selected]); ctx.stroke();}
}
function distance(x, y, a, b) {
  const dx = b[0] - a[0], dy = b[1] - a[1], den = dx * dx + dy * dy;
  const along = den ? Math.max(0, Math.min(1, ((x - a[0]) * dx + (y - a[1]) * dy) / den)) : 0;
  return Math.hypot(x - a[0] - along * dx, y - a[1] - along * dy);
}
function pick(event) {
  if (region === 'all') {message('全国总览请先在图层中选择具体省区。'); return;}
  const {x, y} = event.containerPoint;
  let best = 12, index = -1;
  for (const i of visible) {
    const road = roads[i], a = screen([road.b[0], road.b[1]]), b = screen([road.b[2], road.b[3]]);
    if (x < a[0] - 12 || x > b[0] + 12 || y < a[1] - 12 || y > b[1] + 12) continue;
    for (let k = 1; k < road.pts.length; k++) {
      const d = distance(x, y, screen(road.pts[k - 1]), screen(road.pts[k]));
      if (d < best) {best = d; index = i;}
    }
  }
  if (index < 0) {message('未选中道路，请放大后点击蓝色线段。'); return;}
  selected = index; const road = roads[index];
  $('roadname').textContent = road.name; $('roadref').textContent = '道路编号：' + (road.ref || '未标注');
  $('roadregion').textContent = '所属数据区域：' + road.members.map(k => metadata.regions[k].name).join(' / ');
  $('roadid').textContent = 'OSM 分段 ID：' + road.id; $('info').hidden = false;
  popup.setLatLng(event.latlng).setContent($('info')).openOn(map); drawSoon();
}
function findRoads(query) {
  const q = query.trim().toLowerCase(), isRef = /^[gs]\d+$/i.test(q);
  return active.filter(i => {
    const road = roads[i];
    return isRef ? road.ref.toLowerCase().split(/[;,\s]+/).includes(q) : (road.name + ' ' + road.ref).toLowerCase().includes(q);
  });
}
$('search').addEventListener('submit', e => {
  e.preventDefault(); const q = $('query').value.trim(); closeInfo(); matches.clear(); $('city').value = 'all';
  if (region === 'all') {message('请先选择具体省区，再搜索道路。'); return;}
  $('tools').open = false;
  if (!q) {reset(); return;}
  matches = new Set(findRoads(q));
  message(matches.size ? '找到 ' + matches.size.toLocaleString('zh-CN') + ' 个分段，已用橙色高亮。' : '当前区域未找到，可更换区域或道路名称。');
  if (matches.size) fit(extent(matches)); else drawSoon();
});
$('city').addEventListener('change', e => {
  if (e.target.value === 'all') {reset(); return;}
  const city = activeCities[Number(e.target.value)]; if (!city) return;
  matches.clear(); closeInfo(); $('query').value = ''; $('tools').open = false;
  message('已定位' + city.name + '，可继续放大查看道路。');
  map.setView([city.lat, city.lon], 11, {animate: false});
});
$('region').addEventListener('change', e => chooseRegion(e.target.value).catch(showLoadError));
$('home').onclick = () => {$('tools').open = false; reset();};
$('close').onclick = closeInfo;
map.on('move zoom resize', drawSoon);
map.on('click', pick);
map.on('popupclose', () => {selected = -1; $('info').hidden = true; drawSoon();});
let tileLoaded = 0, tileErrors = 0;
basemap.on('loading', () => {tileLoaded = 0; tileErrors = 0;});
basemap.on('tileload', () => {tileLoaded++; $('tile-notice').hidden = true;});
basemap.on('tileerror', () => {tileErrors++;});
basemap.on('load', () => {$('tile-notice').hidden = !(tileErrors > 0 && tileLoaded === 0);});
await chooseRegion('jingjinji');
}
start().catch(showLoadError);
</script>
</body>
</html>
